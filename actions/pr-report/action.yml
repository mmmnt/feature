name: feat pr report
description: >-
  A pull request build report from feat evidence bundles, the workflow run's jobs and its own-key cosign attestations
  (OCI referrers in GHCR, no transparency log): one updating PR comment and a check run, with an auditable chain of
  evidence (SPEC-PRR-001, ADR-0032).
inputs:
  token:
    description: Token with pull-requests write, checks write, actions read and packages read (merge mode packages write).
    default: ${{ github.token }}
  evidence-dir:
    description: Directory holding the downloaded evidence artifacts, one subdirectory per tier named <evidence-prefix><tier>.
    default: evidence
  subjects:
    description: >-
      Newline-separated `<label>: <OCI repository>` lines, e.g. `SBOM: ghcr.io/<owner>/<repo>-sbom`. Each repository
      holds the signed artifact tagged with the commit the run built.
    default: ""
  required-subjects:
    description: >-
      Newline-separated `<label> from <job>` lines, e.g. `SBOM from build`. A required subject the run did not produce
      makes the report incomplete and names the job (ADR-0032 decision 14).
    default: ""
  public-key:
    description: Path of the repository's committed cosign public key, e.g. ci/signing/flmnt.pub.
    default: cosign.pub
  signing-key:
    description: Merge mode only. The repository's cosign private key (pass a secret). Written to a 0600 file and removed.
    default: ""
  signing-password:
    description: Merge mode only. The private key's password (pass a secret).
    default: ""
  signer-workflows:
    description: Newline-separated workflow paths allowed to have produced this repository's provenance.
    default: .github/workflows/ci.yml
  check-name:
    description: Name of the check run carrying the report.
    default: feat report
  evidence-repository:
    description: GHCR repository main's evidence bundles are stored in (merge mode), e.g. ghcr.io/<owner>/<repo>-evidence.
    default: ""
  evidence-prefix:
    description: Prefix of the evidence artifact names; the rest of the name is the tier (e.g. feat-evidence-unit → unit).
    default: feat-evidence-
  report-job:
    description: Name of the job running this Action, left out of the job tally.
    default: report
runs:
  using: node24
  main: dist/main.js
