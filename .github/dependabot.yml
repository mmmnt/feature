version: 2
updates:
  # The pnpm workspace: packages/*, adapters/* and the root tooling.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'

  # The VS Code extension has its own npm lockfile, outside the workspace.
  - package-ecosystem: 'npm'
    directory: '/editors/vscode'
    schedule:
      interval: 'weekly'
      day: 'monday'
    ignore:
      # @types/vscode must not pass engines.vscode (^1.85.0), or vsce refuses to package the
      # extension. Raise both together, by hand, when the minimum VS Code version moves.
      - dependency-name: '@types/vscode'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      actions:
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'ci'
