name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck & corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Corpus validation
        run: pnpm corpus:validate

  test:
    name: Workspace tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install chromium (real-browser adapter e2e; other nodes auto-skip)
        if: matrix.node == 24
        run: pnpm --filter @mmmnt/feat-adapter-playwright exec playwright install --with-deps chromium
      - name: Workspace tests
        run: npx turbo run test

  windows:
    name: feat-cdk on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (with workspace dependencies)
        run: pnpm --filter @mmmnt/feat-cdk... build
      - name: Test (assembly analysis + resolver + adapter over fixtures)
        run: pnpm --filter @mmmnt/feat-cdk test

  spec:
    name: Spec chain (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: feat verify (spec ↔ test integrity)
        run: node packages/feature/bin/run.js verify
      - name: feat audit (buildability gates)
        run: node packages/feature/bin/run.js audit
      - name: feat lint
        run: node packages/feature/bin/run.js lint
      - name: feat run (generated suites, coverage reported)
        run: node packages/feature/bin/run.js run --coverage
      - name: Upload reports
        if: always() && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: feat-reports
          path: |
            reports/feat-junit.xml
            reports/coverage/lcov.info
          if-no-files-found: ignore
