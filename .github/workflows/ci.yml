name: CI

on:
  push:
    branches: [main]
  pull_request:
  # main merges through a merge queue; the queued result is checked before it lands.
  merge_group:

jobs:
  check:
    name: Typecheck & corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Corpus validation
        run: pnpm corpus:validate
      - name: Local CI pass record
        run: bash scripts/ci-local.test.sh

  test:
    name: Workspace tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Kafka client cache key (Node 26)
        if: matrix.node == 26
        id: kafka-native
        run: echo "key=$(bash scripts/node26-kafka-native.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Kafka client binary cache (Node 26)
        if: matrix.node == 26
        uses: actions/cache@v6
        with:
          path: ~/.cache/feat-kafka-native
          key: ${{ steps.kafka-native.outputs.key }}
      - name: Install
        if: matrix.node != 26
        run: pnpm install --frozen-lockfile
      - name: Install (Node 26 on Linux builds the Kafka client outside the '@' path)
        if: matrix.node == 26
        run: bash scripts/node26-kafka-native.sh
      - name: Build
        run: pnpm build
      - name: Pull the adapter test images (retried)
        run: bash scripts/ci-pull-images.sh
      - name: Install chromium (real-browser adapter e2e; other nodes auto-skip)
        if: matrix.node == 24
        run: pnpm --filter @mmmnt/feat-adapter-playwright exec playwright install --with-deps chromium
      - name: Workspace tests
        run: npx turbo run test --concurrency="${FEAT_TEST_CONCURRENCY:-10}"

  windows:
    name: feat-cdk on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (with workspace dependencies)
        run: pnpm --filter @mmmnt/feat-cdk... build
      - name: Test (assembly analysis + resolver + adapter over fixtures)
        run: pnpm --filter @mmmnt/feat-cdk test

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    # Each step names its directory: scripts/ci-local.sh runs this job too and does not read a
    # job-level `defaults:`.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        working-directory: editors/vscode
        run: npm ci
      - name: Build
        working-directory: editors/vscode
        run: npm run build
      - name: Test
        working-directory: editors/vscode
        run: npm test
      # The same package step the release runs, so a dependency or manifest change that vsce
      # refuses (e.g. @types/vscode above engines.vscode) fails here, not at publish time.
      - name: Package .vsix
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce package --allow-missing-repository --baseContentUrl https://github.com/mmmnt/feature/blob/main/editors/vscode --baseImagesUrl https://raw.githubusercontent.com/mmmnt/feature/main/editors/vscode

  spec:
    name: Spec chain (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Kafka client cache key (Node 26)
        if: matrix.node == 26
        id: kafka-native
        run: echo "key=$(bash scripts/node26-kafka-native.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Kafka client binary cache (Node 26)
        if: matrix.node == 26
        uses: actions/cache@v6
        with:
          path: ~/.cache/feat-kafka-native
          key: ${{ steps.kafka-native.outputs.key }}
      - name: Install
        if: matrix.node != 26
        run: pnpm install --frozen-lockfile
      - name: Install (Node 26 on Linux builds the Kafka client outside the '@' path)
        if: matrix.node == 26
        run: bash scripts/node26-kafka-native.sh
      - name: Build
        run: pnpm build
      - name: Pull the adapter test images (retried)
        run: bash scripts/ci-pull-images.sh
      - name: feat verify (spec ↔ test integrity)
        run: node packages/feature/bin/run.js verify
      - name: feat audit (buildability gates)
        run: node packages/feature/bin/run.js audit
      - name: feat lint
        run: node packages/feature/bin/run.js lint
      - name: feat run (generated suites, coverage reported)
        run: node packages/feature/bin/run.js run --coverage
      - name: Upload reports
        if: always() && matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: feat-reports
          path: |
            .feature/reports/feat-junit.xml
            .feature/coverage/lcov.info
          if-no-files-found: ignore

  runner-vitest:
    # SPEC-RT-010: `feat run` exits 2 on a configuration error under every vitest major the peer range admits.
    # One job per proved major, plus `latest`, which fails SPEC-RT-010 when it resolves to a major the spec has
    # not proved yet (the scenarios' `ran` names the proved majors).
    name: Runner exit codes (Vitest ${{ matrix.vitest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vitest: ["3.2.7", "4.1.12", "5.1.2", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: SPEC-RT-010 under Vitest ${{ matrix.vitest }}
        # The vitest under test goes in a scratch directory, never the workspace: ci-local runs every Node 24 job
        # one after another on one tree. One step, since ci-local never sources GITHUB_ENV between steps.
        run: |
          scratch=$(mktemp -d)
          npm install --prefix "$scratch" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund "vitest@${{ matrix.vitest }}"
          FEAT_PROBE_VITEST="$scratch/node_modules/vitest" node packages/feature/bin/run.js run --spec SPEC-RT-010
