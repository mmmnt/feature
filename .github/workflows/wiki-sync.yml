name: Wiki Sync

# Mirrors every package README (packages/*, adapters/*, editors/*, actions/*) onto the GitHub wiki,
# one page per package: @mmmnt-<pkg> for the @mmmnt packages, VS-Code-Extension for editors/vscode and
# PR-Report-Action for actions/pr-report. docs/adr/README.md, docs/grammar-reference.md and
# docs/evidence-bundle.md are mirrored onto ADR-Index, Grammar-Reference and Evidence-Bundle.
# The source files are the record; a generated wiki page is never edited by hand.
# scripts/wiki-sync.mjs does the rewriting and can be run locally:
#   node scripts/wiki-sync.mjs --wiki-dir <wiki clone> --dry-run
#
# The wiki is its own git repository (mmmnt/feature.wiki.git). It is cloned,
# the pages are written, and a commit is pushed only when a page changed.

on:
  push:
    branches: [main]
    paths:
      - 'packages/*/README.md'
      - 'adapters/*/README.md'
      - 'editors/*/README.md'
      - 'actions/*/README.md'
      - 'docs/**'
      - 'scripts/wiki-sync.mjs'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

# One sync at a time; a later run starts from a fresh clone, so none is lost.
concurrency:
  group: wiki-sync
  cancel-in-progress: false

permissions:
  # GITHUB_TOKEN can push to the repository's wiki when it has contents: write.
  contents: write

jobs:
  sync:
    # A fork has its own wiki; only the upstream repository mirrors into this one.
    if: github.repository == 'mmmnt/feature'
    runs-on: ubuntu-latest
    env:
      WIKI_URL: https://github.com/mmmnt/feature.wiki.git
    steps:
      # Fallback if the wiki ever refuses GITHUB_TOKEN: push as the mmmnt
      # GitHub App instead, the way release.yml does. Uncomment this step and
      # set GH_TOKEN below to ${{ steps.app-token.outputs.token }}. The App
      # needs Contents: write on mmmnt/feature; APP_ID and APP_PRIVATE_KEY are
      # the Actions secrets release.yml already uses.
      #
      # - name: Generate GitHub App token
      #   id: app-token
      #   uses: actions/create-github-app-token@v3
      #   with:
      #     app-id: ${{ secrets.APP_ID }}
      #     private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Clone the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The token goes in an auth header, not the remote URL, so it is not
          # written to wiki/.git/config.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth 1 "$WIKI_URL" wiki

      - name: Write the package and reference pages
        run: node scripts/wiki-sync.mjs --wiki-dir wiki

      - name: Commit and push changed pages
        working-directory: wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches its source files; nothing to push."
            exit 0
          fi
          git diff --cached --stat
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "docs: sync package pages from mmmnt/feature@${GITHUB_SHA::7}"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD
