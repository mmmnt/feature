name: Release

# Publishes all public packages to npm on a version tag (v*), authenticating via
# OpenID Connect (npm Trusted Publishing) — no long-lived tokens. Each package on
# npmjs.com must have this repository + workflow configured as its trusted
# publisher. The release gate is the same chain CI runs.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Gate — corpus, tests, verify, run
        run: |
          pnpm corpus:validate
          npx turbo run test
          node packages/feature/bin/run.js verify
          node packages/feature/bin/run.js run

      - name: Publish changed packages (OIDC trusted publishing)
        run: node scripts/publish-changed.mjs
