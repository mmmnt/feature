name: extension

# Publishes the VS Code extension:
#  - on every toolchain release (v* tags) — the extension version is stamped
#    from the release tag so each release ships the grammar it syncs
#    (founder directive 2026-07-27); registries skip idempotently if the
#    version already exists
#  - on ext-v* tags — out-of-band extension-only releases keeping the
#    version in editors/vscode/package.json
# Targets:
#  - Open VSX (open-vsx.org) — the registry Windsurf, Cursor, Gitpod, and other
#    VS Code forks install from (the MS marketplace only serves official VS Code)
#  - VS Code Marketplace — official VS Code
# Each registry publishes only if its token secret is configured, so the lane
# degrades gracefully while accounts are being set up. The .vsix is always
# built and attached as an artifact.

on:
  push:
    tags:
      - "ext-v*"
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Registry tokens live as environment secrets on `production`, not at repo/org level.
    environment: production
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Stamp version from the release tag
        # Toolchain releases (v*) carry the extension along: its version tracks
        # the release so the freshly synced grammar always ships. ext-v* tags
        # keep the version editors/vscode/package.json declares.
        if: startsWith(github.ref_name, 'v')
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Package .vsix
        run: npx --yes @vscode/vsce package --allow-missing-repository

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: feat-vscode-vsix
          path: editors/vscode/*.vsix

      - name: Publish to Open VSX (Windsurf, Cursor, forks)
        if: env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if curl -sf "https://open-vsx.org/api/mmmnt/feat-vscode/$VERSION" > /dev/null; then
            echo "skip: mmmnt.feat-vscode $VERSION already on Open VSX"
          else
            npx --yes ovsx publish *.vsix -p "$OVSX_PAT"
          fi

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npx --yes @vscode/vsce show mmmnt.feat-vscode --json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const v=JSON.parse(d).versions?.map(x=>x.version)??[];process.exit(v.includes('$VERSION')?0:1)})"; then
            echo "skip: mmmnt.feat-vscode $VERSION already on the VS Code Marketplace"
          else
            npx --yes @vscode/vsce publish --packagePath *.vsix -p "$VSCE_PAT"
          fi
