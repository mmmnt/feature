name: extension

# Publishes the VS Code extension:
#  - on every toolchain release — release.yml calls this workflow with the
#    released version and commit, and the extension is stamped with that version
#    so each release ships the grammar it syncs (founder directive 2026-07-27);
#    registries skip idempotently if the version already exists
#  - by hand (workflow_dispatch) with a released version and its commit, when
#    the release run did not publish it
#  - on ext-v* tags — out-of-band extension-only releases keeping the
#    version in editors/vscode/package.json
# Targets:
#  - Open VSX (open-vsx.org) — the registry Windsurf, Cursor, Gitpod, and other
#    VS Code forks install from (the MS marketplace only serves official VS Code)
#  - VS Code Marketplace — official VS Code
# Each registry publishes only if its token secret is configured, so the lane
# degrades gracefully while accounts are being set up. The .vsix is always
# built and attached as an artifact.

on:
  push:
    tags:
      - "ext-v*"
  workflow_call:
    inputs:
      version:
        description: The toolchain version just released (X.Y.Z); the extension is published at it.
        required: true
        type: string
      ref:
        description: The commit that version was released from.
        required: false
        type: string
  # A safety valve, as in release.yml: publish a released toolchain version by hand when the
  # release run could not (e.g. the release was created outside the workflow).
  workflow_dispatch:
    inputs:
      version:
        description: The released toolchain version (X.Y.Z) to publish the extension at.
        required: true
        type: string
      ref:
        description: The commit that version was released from (its vX.Y.Z tag works).
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # Registry tokens live as environment secrets on `production`, not at repo/org level.
    environment: production
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Stamp the version of the toolchain release
        # Toolchain releases carry the extension along: its version tracks the
        # release so the freshly synced grammar always ships. ext-v* tags keep
        # the version editors/vscode/package.json declares.
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Package .vsix
        # The README links to files elsewhere in the monorepo (../../packages/…). Without a base,
        # vsce resolves them from the repository root and the registry listing links nowhere.
        run: npx --yes @vscode/vsce package --allow-missing-repository --baseContentUrl https://github.com/mmmnt/feature/blob/main/editors/vscode --baseImagesUrl https://raw.githubusercontent.com/mmmnt/feature/main/editors/vscode

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: feat-vscode-vsix
          path: editors/vscode/*.vsix

      - name: Publish to Open VSX (Windsurf, Cursor, forks)
        if: env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if curl -sf "https://open-vsx.org/api/mmmnt/feat-vscode/$VERSION" > /dev/null; then
            echo "skip: mmmnt.feat-vscode $VERSION already on Open VSX"
          else
            npx --yes ovsx publish *.vsix -p "$OVSX_PAT"
          fi

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npx --yes @vscode/vsce show mmmnt.feat-vscode --json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const v=JSON.parse(d).versions?.map(x=>x.version)??[];process.exit(v.includes('$VERSION')?0:1)})"; then
            echo "skip: mmmnt.feat-vscode $VERSION already on the VS Code Marketplace"
          else
            npx --yes @vscode/vsce publish --packagePath *.vsix -p "$VSCE_PAT"
          fi
